[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Sensible defaults for production
fs_permissions = [{ access = "read", path = "./" }]

# If you keep scripts/tests in standard places:
# test = "test"
# script = "script"

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true

[rpc_endpoints]
# Example:
# mainnet = "${MAINNET_RPC_URL}"
